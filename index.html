        nav {
            background: #111;
            padding: 20px;
            display: flex;

            align-items: center;
        }

        .logo {
            color: #D4AF37;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin-left: 15px;
        }

        .menu a:hover {
            color: #D4AF37;
        }

        /* ACCUEIL */
        .accueil {
            padding: 70px 20px;
        }

        h1 {
            color: #D4AF37;
            font-size: 60px;
            letter-spacing: 10px;
        }

        /* CONNEXION */
        .connexion {
            background: white;
            color: black;
            max-width: 400px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
        }

        .connexion h2 span {
            color: #D4AF37;
        }

        .google {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        /* PROFIL */
        #profil {
            display: none;
        }

        #photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #D4AF37;
            margin: 15px;
        }

        #nomUtilisateur {
            font-size: 24px;
            font-weight: bold;
        }

        .deconnexion {
            padding: 12px 25px;
            background: black;
            color: white;
            border: 2px solid #D4AF37;
            border-radius: 10px;
            cursor: pointer;
        }

        .deconnexion:hover {
            background: #D4AF37;
            color: black;
        }
    </style>
</head>
