<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Site d'Amine</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, lightblue, white);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .connexion {
            width: 300px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px gray;
            text-align: center;
        }

        h1 {
            color: darkblue;
        }

        p {
            color: gray;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid gray;
            border-radius: 8px;
        }

        .bouton {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: darkblue;
            color: white;
            font-size: 16px;
        }

        .google {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        #profil {
            display: none;
        }

        #photo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin-top: 15px;
        }

        #message {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="connexion">

    <div id="connexionPage">

        <h1>Bienvenue 👋</h1>

        <p>Connecte-toi à ton compte</p>

        <input
            id="nom"
            type="text"
            placeholder="Nom d'utilisateur"
        >

        <input
            id="motdepasse"
            type="password"
            placeholder="Mot de passe"
        >

        <button class="bouton" onclick="connexion()">
            Se connecter
        </button>

        <p>OU</p>

        <div
            id="g_id_onload"
            data-client_id="698062032997-3jimrhbg2hh8q6miaiubivn4qiv21488.apps.googleusercontent.com"
            data-callback="connexionGoogle"
            data-auto_prompt="false">
        </div>

        <div class="google">
            <div
                class="g_id_signin"
                data-type="standard"
                data-size="large"
                data-theme="outline"
                data-text="continue_with"
                data-shape="rectangular"
                data-use_fedcm_for_button="true">
            </div>
        </div>

        <p id="message"></p>

    </div>


    <div id="profil">

        <h1>Bienvenue ! 🎉</h1>

        <img id="photo" src="" alt="Photo de profil">

        <h2 id="prenom"></h2>

        <p>Tu es connecté avec Google ✅</p>

    </div>

</div>


<script>

function connexion() {

    let nom = document.getElementById("nom").value;
    let motdepasse = document.getElementById("motdepasse").value;

    if (nom === "Amine" && motdepasse === "1234") {

        document.getElementById("message").textContent =
            "Connexion réussie ! 🎉";

        document.getElementById("message").style.color = "green";

    } else {

        document.getElementById("message").textContent =
            "Nom ou mot de passe incorrect ❌";

        document.getElementById("message").style.color = "red";
    }
}


function connexionGoogle(response) {

    // Décoder les informations envoyées par Google
    const donnees = JSON.parse(
        atob(
            response.credential.split(".")[1]
        )
    );

    // Afficher la page du profil
    document.getElementById("connexionPage").style.display =
        "none";

    document.getElementById("profil").style.display =
        "block";

    // Afficher le nom
    document.getElementById("prenom").textContent =
        donnees.name;

    // Afficher la photo
    document.getElementById("photo").src =
        donnees.picture;
}

</script>

</body>
</html>
